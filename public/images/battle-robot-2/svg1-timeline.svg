<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede5dd;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4652a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8854a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1a237e">NHRL 成長の軌跡 — 六つの数字で見る7年</text>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">2018 → 2026</text>

  <!-- Timeline axis -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="#ccc" stroke-width="2"/>
  <line x1="80" y1="117" x2="80" y2="123" stroke="#999" stroke-width="2"/>
  <line x1="720" y1="117" x2="720" y2="123" stroke="#999" stroke-width="2"/>

  <!-- 1: 4,000 subscribers -->
  <circle cx="140" cy="120" r="12" fill="#d4652a"/>
  <text x="140" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1</text>
  <text x="140" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4652a" font-weight="bold">2018</text>
  <text x="140" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">登録者</text>
  <text x="140" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#d4652a">4,000人</text>

  <!-- 2: 400,000 views -->
  <circle cx="240" cy="120" r="12" fill="#d4652a"/>
  <text x="240" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2</text>
  <text x="240" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4652a" font-weight="bold">年間再生</text>
  <text x="240" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">40万回</text>
  <text x="240" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#d4652a">400K</text>

  <!-- Arrow -->
  <text x="310" y="125" text-anchor="middle" font-size="18" fill="#999">→</text>

  <!-- 3: 3M subscribers -->
  <circle cx="380" cy="120" r="12" fill="#d4652a"/>
  <text x="380" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3</text>
  <text x="380" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4652a" font-weight="bold">2026</text>
  <text x="380" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">登録者</text>
  <text x="380" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#d4652a">300万人</text>

  <!-- 4: 500M views -->
  <circle cx="500" cy="120" r="12" fill="#1a237e"/>
  <text x="500" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4</text>
  <text x="500" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a237e" font-weight="bold">年間再生</text>
  <text x="500" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">5億回目標</text>
  <text x="500" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a237e">500M</text>

  <!-- Arrow -->
  <text x="570" y="125" text-anchor="middle" font-size="18" fill="#999">→</text>

  <!-- 5: 70 events -->
  <circle cx="630" cy="120" r="12" fill="#1a237e"/>
  <text x="630" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="bold">5</text>
  <text x="630" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a237e" font-weight="bold">累計</text>
  <text x="630" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">イベント数</text>
  <text x="630" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a237e">70回</text>

  <!-- Growth bar chart section -->
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a237e">成長倍率（対2018年比）</text>

  <!-- Bar: Subscribers 750x -->
  <rect x="100" y="240" width="180" height="30" rx="4" fill="url(#bar1)"/>
  <text x="120" y="260" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">登録者 ×750</text>

  <!-- Bar: Views 1250x -->
  <rect x="100" y="285" width="220" height="30" rx="4" fill="url(#bar1)"/>
  <text x="120" y="305" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">再生回数 ×1,250</text>

  <!-- Bar: Events -->
  <rect x="100" y="330" width="140" height="30" rx="4" fill="url(#bar2)"/>
  <text x="120" y="350" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">コミュニティ ×70</text>

  <!-- Bar: 2027 target -->
  <rect x="100" y="375" width="280" height="30" rx="4" fill="url(#bar2)"/>
  <text x="120" y="395" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">2027 Pro League — 未踏の領域</text>

  <!-- Annotation -->
  <text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">出典: NHRL CEOブログ記事（2026年6月29日）| 加藤ラジコン出版</text>

  <!-- Decorative -->
  <rect x="0" y="0" width="800" height="4" fill="#d4652a"/>
</svg>
