<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#f5f0eb" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#d4652a">抽象表現主義 年表 — 1943–1970</text>
  
  <!-- Timeline axis -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="#d4652a" stroke-width="3"/>
  
  <!-- Arrow -->
  <polygon points="840,115 855,120 840,125" fill="#d4652a"/>
  
  <!-- Year markers and events -->
  <!-- 1943 -- Pollock first drip -->
  <line x1="120" y1="115" x2="120" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1943</text>
  <circle cx="120" cy="120" r="6" fill="#d4652a"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#555">ポロック</text>
  <text x="120" y="165" text-anchor="middle" font-size="10" fill="#777">滴下開始</text>

  <!-- 1947 -- Drip technique -->
  <line x1="200" y1="115" x2="200" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="200" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1947</text>
  <circle cx="200" cy="120" r="6" fill="#d4652a"/>
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#555">ポロック</text>
  <text x="200" y="165" text-anchor="middle" font-size="10" fill="#777">ドリップ確立</text>

  <!-- 1948 -- Newman Onement I -->
  <line x1="280" y1="115" x2="280" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="280" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1948</text>
  <circle cx="280" cy="120" r="6" fill="#d4652a"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#555">ニューマン</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#777">Onement I</text>

  <!-- 1950 -- de Kooning Woman I -->
  <line x1="360" y1="115" x2="360" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="360" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1950</text>
  <circle cx="360" cy="120" r="6" fill="#d4652a"/>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#555">デ・クーニング</text>
  <text x="360" y="165" text-anchor="middle" font-size="10" fill="#777">Woman I</text>

  <!-- 1952 -- Rothko Chapel concept -->
  <line x1="440" y1="115" x2="440" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1952</text>
  <circle cx="440" cy="120" r="6" fill="#d4652a"/>
  <text x="440" y="195" text-anchor="middle" font-size="11" fill="#555">ロスコ</text>
  <text x="440" y="210" text-anchor="middle" font-size="10" fill="#777">色の瞑想</text>

  <!-- 1955 -- Pollock顶峰 -->
  <line x1="520" y1="115" x2="520" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="520" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1956</text>
  <circle cx="520" cy="120" r="6" fill="#d4652a"/>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#555">ポロック</text>
  <text x="520" y="165" text-anchor="middle" font-size="10" fill="#777">死去</text>

  <!-- 1958 -- Rothko Four Seasons -->
  <line x1="600" y1="115" x2="600" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1958</text>
  <circle cx="600" cy="120" r="6" fill="#d4652a"/>
  <text x="600" y="195" text-anchor="middle" font-size="11" fill="#555">ロスコ</text>
  <text x="600" y="210" text-anchor="middle" font-size="10" fill="#777">フォーシーズンズ</text>

  <!-- 1962 -- Pop Art -->
  <line x1="680" y1="115" x2="680" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="680" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1962</text>
  <circle cx="680" cy="120" r="6" fill="#d4652a"/>
  <text x="680" y="150" text-anchor="middle" font-size="11" fill="#555">ポップアート</text>
  <text x="680" y="165" text-anchor="middle" font-size="10" fill="#777">台頭</text>

  <!-- 1970 -- Rothko death -->
  <line x1="760" y1="115" x2="760" y2="125" stroke="#d4652a" stroke-width="2"/>
  <text x="760" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1970</text>
  <circle cx="760" cy="120" r="6" fill="#d4652a"/>
  <text x="760" y="195" text-anchor="middle" font-size="11" fill="#555">ロスコ死去</text>
  <text x="760" y="210" text-anchor="middle" font-size="10" fill="#777">ニューマン死去</text>

  <!-- Color band -->
  <rect x="60" y="260" width="780" height="6" fill="#d4652a" rx="3" opacity="0.3"/>

  <!-- Era labels -->
  <text x="160" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">形成期</text>
  <rect x="100" y="275" width="120" height="2" fill="#d4652a" rx="1" opacity="0.5"/>
  <text x="350" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">全盛期</text>
  <rect x="240" y="275" width="220" height="2" fill="#d4652a" rx="1" opacity="0.5"/>
  <text x="550" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">拡散期</text>
  <rect x="470" y="275" width="160" height="2" fill="#d4652a" rx="1" opacity="0.5"/>
  <text x="720" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">衰退期</text>
  <rect x="640" y="275" width="160" height="2" fill="#d4652a" rx="1" opacity="0.5"/>

  <!-- Legend -->
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#555">凡例</text>
  <circle cx="270" cy="365" r="4" fill="#d4652a"/>
  <text x="282" y="369" font-size="11" fill="#555">アクション・ペインティング（ポロック、デ・クーニング）</text>
  <rect x="530" y="361" width="8" height="8" fill="#d4652a" rx="2"/>
  <text x="546" y="369" font-size="11" fill="#555">カラーフィールド（ロスコ、ニューマン）</text>
</svg>