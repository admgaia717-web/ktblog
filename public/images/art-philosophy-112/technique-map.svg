<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#f5f0eb" rx="8"/>
  
  <text x="450" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#d4652a">抽象表現主義 技法マップ</text>

  <!-- Central hub -->
  <circle cx="450" cy="200" r="60" fill="#d4652a" opacity="0.9"/>
  <text x="450" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="white">抽象表現主義</text>
  <text x="450" y="213" text-anchor="middle" font-size="11" fill="white">1943–1970</text>

  <!-- Branch 1: Drip -->
  <line x1="410" y1="155" x2="180" y2="80" stroke="#d4652a" stroke-width="2" opacity="0.6"/>
  <rect x="40" y="45" width="160" height="70" rx="8" fill="white" stroke="#d4652a" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4652a">ドリップ</text>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#555">絵の具を滴下</text>
  <text x="120" y="103" text-anchor="middle" font-size="10" fill="#777">ポロック</text>

  <!-- Branch 2: Color Field -->
  <line x1="450" y1="140" x2="450" y2="75" stroke="#d4652a" stroke-width="2" opacity="0.6"/>
  <rect x="355" y="30" width="190" height="55" rx="8" fill="white" stroke="#d4652a" stroke-width="1.5"/>
  <text x="450" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4652a">カラーフィールド</text>
  <text x="450" y="70" text-anchor="middle" font-size="11" fill="#555">単色矩形の重なり</text>

  <!-- Branch 3: Impasto -->
  <line x1="490" y1="155" x2="720" y2="80" stroke="#d4652a" stroke-width="2" opacity="0.6"/>
  <rect x="660" y="45" width="200" height="70" rx="8" fill="white" stroke="#d4652a" stroke-width="1.5"/>
  <text x="760" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4652a">厚塗り＋引っかき</text>
  <text x="760" y="88" text-anchor="middle" font-size="11" fill="#555">重層的な塗り重ね</text>
  <text x="760" y="103" text-anchor="middle" font-size="10" fill="#777">デ・クーニング</text>

  <!-- Branch 4: Zip -->
  <line x1="500" y1="235" x2="750" y2="310" stroke="#d4652a" stroke-width="2" opacity="0.6"/>
  <rect x="680" y="295" width="180" height="70" rx="8" fill="white" stroke="#d4652a" stroke-width="1.5"/>
  <text x="770" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4652a">ジップ</text>
  <text x="770" y="338" text-anchor="middle" font-size="11" fill="#555">垂直線による分割</text>
  <text x="770" y="353" text-anchor="middle" font-size="10" fill="#777">ニューマン</text>

  <!-- Branch 5: Stain -->
  <line x1="400" y1="240" x2="180" y2="310" stroke="#d4652a" stroke-width="2" opacity="0.6"/>
  <rect x="40" y="295" width="180" height="70" rx="8" fill="white" stroke="#d4652a" stroke-width="1.5"/>
  <text x="130" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4652a">ステイン</text>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#555">絵の具を染み込ませる</text>
  <text x="130" y="353" text-anchor="middle" font-size="10" fill="#777">フランケンサーラー</text>

  <!-- Key insight box -->
  <rect x="200" y="345" width="500" height="55" rx="8" fill="#d4652a" opacity="0.08"/>
  <text x="450" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4652a">共通認識：描くこと＝自己の内面を開示する行為</text>
  <text x="450" y="387" text-anchor="middle" font-size="11" fill="#555">「何を描くか」から「いかに描くか」への認識の転換</text>
</svg>