<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#f5f0eb" rx="8"/>
  
  <text x="450" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#d4652a">四大巨匠比較 — 技法・哲学・遺産</text>

  <!-- Header row -->
  <rect x="40" y="55" width="120" height="30" fill="#d4652a" rx="4"/>
  <text x="100" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">指標</text>
  <rect x="165" y="55" width="170" height="30" fill="#d4652a" rx="4"/>
  <text x="250" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ポロック</text>
  <rect x="340" y="55" width="170" height="30" fill="#d4652a" rx="4"/>
  <text x="425" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ロスコ</text>
  <rect x="515" y="55" width="170" height="30" fill="#d4652a" rx="4"/>
  <text x="600" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">デ・クーニング</text>
  <rect x="690" y="55" width="170" height="30" fill="#d4652a" rx="4"/>
  <text x="775" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ニューマン</text>

  <!-- Row 1: 技法 -->
  <text x="100" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">技法</text>
  <line x1="40" y1="127" x2="860" y2="127" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="118" text-anchor="middle" font-size="11" fill="#555">ドリップ</text>
  <text x="425" y="118" text-anchor="middle" font-size="11" fill="#555">カラーフィールド</text>
  <text x="600" y="118" text-anchor="middle" font-size="11" fill="#555">厚塗り＋引っかき</text>
  <text x="775" y="118" text-anchor="middle" font-size="11" fill="#555">ジップ（垂直線）</text>

  <!-- Row 2: 画面 -->
  <text x="100" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">画面</text>
  <line x1="40" y1="162" x2="860" y2="162" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="153" text-anchor="middle" font-size="11" fill="#555">全面均等</text>
  <text x="425" y="153" text-anchor="middle" font-size="11" fill="#555">静謐・大矩形</text>
  <text x="600" y="153" text-anchor="middle" font-size="11" fill="#555">暴力的筆致</text>
  <text x="775" y="153" text-anchor="middle" font-size="11" fill="#555">単色＋垂直線</text>

  <!-- Row 3: 感情 -->
  <text x="100" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">感情方向</text>
  <line x1="40" y1="197" x2="860" y2="197" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="188" text-anchor="middle" font-size="11" fill="#555">外向的・爆発</text>
  <text x="425" y="188" text-anchor="middle" font-size="11" fill="#555">内向的・瞑想</text>
  <text x="600" y="188" text-anchor="middle" font-size="11" fill="#555">具象と抽象の葛藤</text>
  <text x="775" y="188" text-anchor="middle" font-size="11" fill="#555">崇高・超越</text>

  <!-- Row 4: 代表作 -->
  <text x="100" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">代表作</text>
  <line x1="40" y1="232" x2="860" y2="232" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="223" text-anchor="middle" font-size="10" fill="#555">No.5, 1948</text>
  <text x="425" y="223" text-anchor="middle" font-size="10" fill="#555">No.61 (Rust/Blue)</text>
  <text x="600" y="223" text-anchor="middle" font-size="10" fill="#555">Woman I</text>
  <text x="775" y="223" text-anchor="middle" font-size="10" fill="#555">Vir Heroicus Sublimis</text>

  <!-- Row 5: 最高値 -->
  <text x="100" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">最高値</text>
  <line x1="40" y1="267" x2="860" y2="267" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="258" text-anchor="middle" font-size="11" fill="#555">$140M (2006)</text>
  <text x="425" y="258" text-anchor="middle" font-size="11" fill="#555">$87M (2021)</text>
  <text x="600" y="258" text-anchor="middle" font-size="11" fill="#555">$68M (2018)</text>
  <text x="775" y="258" text-anchor="middle" font-size="11" fill="#555">$84M (2013)</text>

  <!-- Row 6: 影響 -->
  <text x="100" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">後世への影響</text>
  <line x1="40" y1="302" x2="860" y2="302" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="293" text-anchor="middle" font-size="11" fill="#555">アクション・アート</text>
  <text x="425" y="293" text-anchor="middle" font-size="11" fill="#555">瞑想空間・教会</text>
  <text x="600" y="293" text-anchor="middle" font-size="11" fill="#555">YBA・現代絵画</text>
  <text x="775" y="293" text-anchor="middle" font-size="11" fill="#555">ミニマリズム</text>

  <!-- Additional panel: Two Streams of Abstract Expressionism -->
  <rect x="40" y="330" width="820" height="150" fill="white" rx="6" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4"/>

  <text x="450" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#d4652a">抽象表現主義の二大潮流</text>

  <!-- Action Painting -->
  <rect x="60" y="375" width="380" height="90" fill="#fde8d0" rx="6"/>
  <text x="250" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4652a">アクション・ペインティング</text>
  <text x="250" y="420" text-anchor="middle" font-size="11" fill="#555">ポロック・デ・クーニング</text>
  <text x="250" y="440" text-anchor="middle" font-size="11" fill="#555">「描く行為」そのものを作品化</text>
  <text x="250" y="456" text-anchor="middle" font-size="11" fill="#555">絵画＝画家の行動記録</text>

  <!-- Color Field -->
  <rect x="460" y="375" width="380" height="90" fill="#f5e6d3" rx="6"/>
  <text x="650" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4652a">カラーフィールド</text>
  <text x="650" y="420" text-anchor="middle" font-size="11" fill="#555">ロスコ・ニューマン</text>
  <text x="650" y="440" text-anchor="middle" font-size="11" fill="#555">巨大画面を単色で覆う</text>
  <text x="650" y="456" text-anchor="middle" font-size="11" fill="#555">色そのものの生理的体験</text>
</svg>