<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#f5f0eb"/>
  
  <text x="400" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#333">M5 Max 制作ワークフロー</text>
  <text x="400" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#888">6ステップで完結するプロフェッショナルパイプライン</text>

  <!-- Step 1 -->
  <rect x="25" y="75" width="110" height="100" rx="10" fill="#d4652a"/>
  <text x="80" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">1</text>
  <text x="80" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">ラフ検討</text>
  <text x="80" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.85">〜2秒/枚</text>
  <text x="80" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">FLUX.2 klein</text>

  <!-- Arrow 1→2 -->
  <line x1="135" y1="125" x2="155" y2="125" stroke="#d4652a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="160" y="75" width="110" height="100" rx="10" fill="#e8894a"/>
  <text x="215" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">2</text>
  <text x="215" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">品質詰め</text>
  <text x="215" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.85">〜15-30秒</text>
  <text x="215" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">FLUX.2 dev/Krea</text>

  <!-- Arrow 2→3 -->
  <line x1="270" y1="125" x2="290" y2="125" stroke="#e8894a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <rect x="295" y="75" width="110" height="100" rx="10" fill="#c04020"/>
  <text x="350" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">3</text>
  <text x="350" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">修正</text>
  <text x="350" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.85">〜1-2分</text>
  <text x="350" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">インペイント</text>

  <!-- Arrow 3→4 -->
  <line x1="405" y1="125" x2="425" y2="125" stroke="#c04020" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 4 -->
  <rect x="430" y="75" width="110" height="100" rx="10" fill="#d4652a"/>
  <text x="485" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">4</text>
  <text x="485" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">拡大</text>
  <text x="485" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.85">〜3-8秒</text>
  <text x="485" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">SeedVR2</text>

  <!-- Arrow 4→5 -->
  <line x1="540" y1="125" x2="560" y2="125" stroke="#d4652a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="565" y="75" width="110" height="100" rx="10" fill="#e8894a"/>
  <text x="620" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">5</text>
  <text x="620" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">文字組み</text>
  <text x="620" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.85">必要時のみ</text>
  <text x="620" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">Ideogram 4</text>

  <!-- Arrow 5→6 -->
  <line x1="675" y1="125" x2="695" y2="125" stroke="#e8894a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 6 -->
  <rect x="700" y="75" width="80" height="100" rx="10" fill="#c04020"/>
  <text x="740" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">6</text>
  <text x="740" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">自動化</text>
  <text x="740" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.85">バッチ処理</text>
  <text x="740" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" opacity="0.7">ComfyUI</text>

  <!-- Total time bar -->
  <rect x="25" y="200" width="755" height="40" rx="8" fill="#333" opacity="0.9"/>
  <text x="400" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">トータル: ラフから最終出力まで 約2〜5分/枚</text>
  <text x="400" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#aaa">Draw Thingsのネイティブ最適化により、全行程をノートPC一台で完結</text>

  <!-- Tool usage note -->
  <rect x="25" y="260" width="350" height="80" rx="8" fill="#e0d5cc"/>
  <text x="200" y="283" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#555">🖥️ GUI操作</text>
  <text x="200" y="303" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">人間が直接操作（Draw Things GUI）</text>
  <text x="200" y="321" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">直感的なスライダー・ボタン操作</text>

  <rect x="425" y="260" width="355" height="80" rx="8" fill="#e0d5cc"/>
  <text x="602" y="283" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#555">🤖 自動化</text>
  <text x="602" y="303" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">ComfyUIでワークフロー保存</text>
  <text x="602" y="321" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">エージェントから再実行・バッチ処理</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4652a"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8894a"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c04020"/>
    </marker>
  </defs>
</svg>
