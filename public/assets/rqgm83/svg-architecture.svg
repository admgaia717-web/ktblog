<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f5f0eb"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#333">M5 Max 三層構成アーキテクチャ</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#888">Draw Things + ComfyUI + MFLUX</text>
  
  <!-- Layer 1: Draw Things -->
  <rect x="60" y="90" width="220" height="130" rx="10" fill="#d4652a" opacity="0.85"/>
  <text x="170" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Draw Things</text>
  <text x="170" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#fff" opacity="0.9">高速レンダリング核</text>
  <text x="170" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">日常生成の9割を担当</text>
  <text x="170" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">FLUX.2 klein/dev</text>
  <text x="170" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">Qwen Image・SeedVR2</text>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="155" x2="340" y2="155" stroke="#d4652a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="310" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d4652a">gRPC</text>

  <!-- Layer 2: ComfyUI -->
  <rect x="350" y="90" width="220" height="130" rx="10" fill="#e8894a" opacity="0.85"/>
  <text x="460" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">ComfyUI</text>
  <text x="460" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#fff" opacity="0.9">ワークフロー自動化</text>
  <text x="460" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">ノードエディタで設計</text>
  <text x="460" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">バッチ生成自動化</text>
  <text x="460" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.8">ControlNet・プロンプト管理</text>

  <!-- Arrow 2→3 -->
  <line x1="570" y1="155" x2="630" y2="155" stroke="#e8894a" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="600" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e8894a">連携</text>

  <!-- Layer 3: MFLUX -->
  <rect x="640" y="90" width="100" height="130" rx="10" fill="#c04020" opacity="0.85"/>
  <text x="690" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">MFLUX</text>
  <text x="690" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.9">実験場</text>
  <text x="690" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.8">最新モデル</text>
  <text x="690" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.8">CLI/API</text>
  <text x="690" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" opacity="0.8">MLXベース</text>

  <!-- Hardware layer -->
  <rect x="60" y="260" width="680" height="60" rx="10" fill="#333" opacity="0.9"/>
  <text x="400" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">M5 Max (40コアGPU / 128GB Unified Memory / 614GB/s)</text>
  <text x="400" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#aaa">Apple Silicon — ノートPCで実現する最強のローカル作画基盤</text>

  <!-- Triangle arrows to hardware -->
  <line x1="170" y1="220" x2="170" y2="260" stroke="#d4652a" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="460" y1="220" x2="460" y2="260" stroke="#e8894a" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="690" y1="220" x2="690" y2="260" stroke="#c04020" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Speed indicators -->
  <rect x="60" y="350" width="200" height="100" rx="8" fill="#e0d5cc"/>
  <text x="160" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#d4652a">⚡ 高速</text>
  <text x="160" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">ラフ生成: 〜2秒</text>
  <text x="160" y="416" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">FLUX.2 klein 4B</text>
  <text x="160" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Lightning Draft連携</text>

  <rect x="300" y="350" width="200" height="100" rx="8" fill="#e0d5cc"/>
  <text x="400" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#e8894a">🎯 高品質</text>
  <text x="400" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">本番生成: 〜30秒</text>
  <text x="400" y="416" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">FLUX.2 dev 32B</text>
  <text x="400" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">8-bit S量子化</text>

  <rect x="540" y="350" width="200" height="100" rx="8" fill="#e0d5cc"/>
  <text x="640" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#c04020">🔬 研究</text>
  <text x="640" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Krea 2 Turbo 12B</text>
  <text x="640" y="416" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Ideogram 4 FP8</text>
  <text x="640" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">コマンドライン操作</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4652a"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8894a"/>
    </marker>
  </defs>
</svg>
