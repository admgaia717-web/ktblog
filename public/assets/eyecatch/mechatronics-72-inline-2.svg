<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0eb"/>
      <stop offset="100%" style="stop-color:#ebe3d8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg2)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c2c2c">フィジカルAI システムアーキテクチャ</text>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#666">FANUC × Google Gemini Enterprise</text>
  
  <!-- Layer 1: Human Interface -->
  <rect x="50" y="85" width="700" height="75" fill="#d4652a" rx="8" opacity="0.15"/>
  <rect x="50" y="85" width="700" height="75" fill="none" stroke="#d4652a" stroke-width="2" rx="8"/>
  <text x="70" y="108" font-size="14" font-weight="bold" fill="#d4652a">第一層: 人間インターフェース</text>
  <text x="70" y="128" font-size="12" fill="#555">自然言語指示 → 「あの赤い部品を取って、左のコンベアに置いて」</text>
  <text x="70" y="148" font-size="11" fill="#888">ティーチングペンダント / ボイスコマンド / タブレットUI</text>
  
  <!-- Arrow down -->
