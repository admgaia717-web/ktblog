  <text x="475" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c27b0">デジタルツイン</text>
  <text x="475" y="475" text-anchor="middle" font-size="9" fill="#666">CNC Design Studio</text>
  
  <rect x="540" y="438" width="100" height="50" fill="white" rx="6" stroke="#9c27b0" stroke-width="1"/>
  <text x="590" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c27b0">PLC対応</text>
  <text x="590" y="475" text-anchor="middle" font-size="9" fill="#666">既存産業互換</text>
  
  <rect x="655" y="438" width="80" height="50" fill="white" rx="6" stroke="#9c27b0" stroke-width="1"/>
  <text x="695" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c27b0">IP69K</text>
  <text x="695" y="475" text-anchor="middle" font-size="9" fill="#666">保護等級</text>
