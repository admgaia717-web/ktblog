<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0eb"/>
      <stop offset="100%" style="stop-color:#ebe3d8"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4652a"/>
      <stop offset="100%" style="stop-color:#b8521f"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a7dd4"/>
      <stop offset="100%" style="stop-color:#1f6ab8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c2c2c">世界産業用ロボット市場 — 4社シェア比較（2026）</text>
  <text x="400" y="70" text-anchor="middle" font-size="13" fill="#666">出典: IFR World Robotics 2026</text>
  
  <!-- Bar chart area -->
  <rect x="80" y="90" width="640" height="350" fill="white" rx="8" opacity="0.6"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="140" text-anchor="end" font-size="11" fill="#666">20%</text>
  <text x="70" y="210" text-anchor="end" font-size="11" fill="#666">15%</text>
  <text x="70" y="280" text-anchor="end" font-size="11" fill="#666">10%</text>
  <text x="70" y="350" text-anchor="end" font-size="11" fill="#666">5%</text>
  <text x="70" y="420" text-anchor="end" font-size="11" fill="#666">0%</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="130" x2="720" y2="130" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="200" x2="720" y2="200" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="270" x2="720" y2="270" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="340" x2="720" y2="340" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="410" x2="720" y2="410" stroke="#ddd" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- FANUC: 19.2% -->
  <rect x="130" y="104" width="100" height="306" fill="url(#bar1)" rx="4"/>
  <text x="180" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4652a">19.2%</text>
  
  <!-- ABB: 14.8% -->
  <rect x="280" y="174" width="100" height="236" fill="url(#bar2)" rx="4"/>
  <text x="330" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a7dd4">14.8%</text>
  
  <!-- KUKA: 12.1% -->
  <rect x="430" y="216" width="100" height="194" fill="url(#bar3)" rx="4"/>
  <text x="480" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#4caf50">12.1%</text>
  
  <!-- Yaskawa: 10.5% -->
  <rect x="580" y="242" width="100" height="168" fill="url(#bar4)" rx="4"/>
  <text x="630" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">10.5%</text>
  
  <!-- X-axis labels -->
  <text x="180" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2c2c">FANUC</text>
  <text x="180" y="450" text-anchor="middle" font-size="10" fill="#888">🇯🇵 日本</text>
  <text x="330" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2c2c">ABB</text>
  <text x="330" y="450" text-anchor="middle" font-size="10" fill="#888">🇨🇭 スイス</text>
  <text x="480" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2c2c">KUKA</text>
  <text x="480" y="450" text-anchor="middle" font-size="10" fill="#888">🇩🇪 ドイツ</text>
  <text x="630" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2c2c">Yaskawa</text>
  <text x="630" y="450" text-anchor="middle" font-size="10" fill="#888">🇯🇵 日本</text>
  
  <!-- Key insight -->
  <rect x="120" y="465" width="560" height="28" fill="#d4652a" rx="4" opacity="0.15"/>
  <text x="400" y="484" text-anchor="middle" font-size="12" fill="#d4652a" font-weight="bold">FANUCが1位。AI統合で差を広げる — 1,000台以上フィジカルAI搭載ロボット出荷済み</text>
</svg>