<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#f5f0eb">
  <style>text{font-family:sans-serif;fill:#333}</style>
  <rect width="800" height="500" fill="#f5f0eb" rx="8"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#d4652a">古典GA vs AIアート — 比較マップ</text>

  <!-- Classical GA column -->
  <rect x="40" y="55" width="350" height="420" rx="8" fill="#f0e5da" stroke="#d4652a" stroke-width="1.5"/>
  <rect x="40" y="55" width="350" height="35" rx="8" fill="#d4652a"/>
  <rect x="40" y="72" width="350" height="18" fill="#d4652a"/>
  <text x="215" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">古典ジェネラティブアート</text>

  <text x="60" y="115" font-size="11" font-weight="bold" fill="#d4652a">ルール設計</text>
  <text x="60" y="132" font-size="10" fill="#444">アーティストが明示的な</text>
  <text x="60" y="147" font-size="10" fill="#444">アルゴリズムを設計</text>

  <line x1="60" y1="160" x2="370" y2="160" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="178" font-size="11" font-weight="bold" fill="#d4652a">予測不可能性</text>
  <text x="60" y="195" font-size="10" fill="#444">決定的ルール＋乱数による</text>
  <text x="60" y="210" font-size="10" fill="#444">制御された偶然</text>

  <line x1="60" y1="223" x2="370" y2="223" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="241" font-size="11" font-weight="bold" fill="#d4652a">作者性</text>
  <text x="60" y="258" font-size="10" fill="#444">アーティスト＝ルール設計者</text>
  <text x="60" y="273" font-size="10" fill="#444">システム＝実行器</text>

  <line x1="60" y1="286" x2="370" y2="286" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="304" font-size="11" font-weight="bold" fill="#d4652a">透明性</text>
  <text x="60" y="321" font-size="10" fill="#444">コードは完全に可視</text>
  <text x="60" y="336" font-size="10" fill="#444">再現・検証可能</text>

  <line x1="60" y1="349" x2="370" y2="349" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="367" font-size="11" font-weight="bold" fill="#d4652a">道具</text>
  <text x="60" y="384" font-size="10" fill="#444">Processing, p5.js, openFw</text>
  <text x="60" y="399" font-size="10" fill="#444">TouchDesigner, vvvv</text>

  <line x1="60" y1="412" x2="370" y2="412" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="430" font-size="11" font-weight="bold" fill="#d4652a">代表作</text>
  <text x="60" y="447" font-size="10" fill="#444">Molnár Réticulée /</text>
  <text x="60" y="462" font-size="10" fill="#444">Nees Schotter / Fidenza</text>

  <!-- AI Art column -->
  <rect x="410" y="55" width="350" height="420" rx="8" fill="#f5e0d0" stroke="#e8873a" stroke-width="1.5"/>
  <rect x="410" y="55" width="350" height="35" rx="8" fill="#e8873a"/>
  <rect x="410" y="72" width="350" height="18" fill="#e8873a"/>
  <text x="585" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">AI生成アート</text>

  <text x="430" y="115" font-size="11" font-weight="bold" fill="#e8873a">プロンプト設計</text>
  <text x="430" y="132" font-size="10" fill="#444">自然言語で「お願い」</text>
  <text x="430" y="147" font-size="10" fill="#444">内部はブラックボックス</text>

  <line x1="430" y1="160" x2="740" y2="160" stroke="#ddd" stroke-width="1"/>

  <text x="430" y="178" font-size="11" font-weight="bold" fill="#e8873a">多様な出力</text>
  <text x="430" y="195" font-size="10" fill="#444">広大な潜在空間からの</text>
  <text x="430" y="210" font-size="10" fill="#444">サンプリング</text>

  <line x1="430" y1="223" x2="740" y2="223" stroke="#ddd" stroke-width="1"/>

  <text x="430" y="241" font-size="11" font-weight="bold" fill="#e8873a">共創性</text>
  <text x="430" y="258" font-size="10" fill="#444">人間＋モデル＋データ</text>
  <text x="430" y="273" font-size="10" fill="#444">の三者共創</text>

  <line x1="430" y1="286" x2="740" y2="286" stroke="#ddd" stroke-width="1"/>

  <text x="430" y="304" font-size="11" font-weight="bold" fill="#e8873a">不透明性</text>
  <text x="430" y="321" font-size="10" fill="#444">モデル内部は</text>
  <text x="430" y="336" font-size="10" fill="#444">解釈困難</text>

  <line x1="430" y1="349" x2="740" y2="349" stroke="#ddd" stroke-width="1"/>

  <text x="430" y="367" font-size="11" font-weight="bold" fill="#e8873a">道具</text>
  <text x="430" y="384" font-size="10" fill="#444">Stable Diffusion,</text>
  <text x="430" y="399" font-size="10" fill="#444">DALL-E, Midjourney</text>

  <line x1="430" y1="412" x2="740" y2="412" stroke="#ddd" stroke-width="1"/>

  <text x="430" y="430" font-size="11" font-weight="bold" fill="#e8873a">代表作</text>
  <text x="430" y="447" font-size="10" fill="#444">Anadol Unsupervised /</text>
  <text x="430" y="462" font-size="10" fill="#444">Midjourneyエコシステム</text>

  <text x="400" y="490" text-anchor="middle" font-size="8" fill="#ccc">加藤ラジコン出版 | 芸術 #100 付録</text>
</svg>
