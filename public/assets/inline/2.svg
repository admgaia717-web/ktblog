<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f5f0eb"/>
  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d4652a" text-anchor="middle">ExpressLRS ファームウェア進化の系譜</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">2019 — 2026 | オープンソースRCリンクプロトコルの7年</text>
  
  <!-- Timeline -->
  <line x1="80" y1="140" x2="720" y2="140" stroke="#d4652a" stroke-width="3"/>
  
  <!-- Version nodes -->
  <!-- v1.x -->
  <circle cx="140" cy="140" r="18" fill="#d4652a" stroke="#fff" stroke-width="2"/>
  <text x="140" y="145" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">v1</text>
  <text x="140" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2019-2021</text>
  <text x="140" y="205" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">初期プロトコル</text>
  
  <!-- v2.x -->
  <circle cx="280" cy="140" r="18" fill="#d4652a" stroke="#fff" stroke-width="2"/>
  <text x="280" y="145" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">v2</text>
  <text x="280" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2021-2023</text>
  <text x="280" y="205" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">安定化・普及期</text>
  
  <!-- v3.x -->
  <circle cx="420" cy="140" r="20" fill="#d4652a" stroke="#fff" stroke-width="2"/>
  <text x="420" y="145" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">v3</text>
  <text x="420" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2023-2025</text>
  <text x="420" y="205" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">MAVLink対応準備</text>
  
  <!-- v4.0 ★ -->
  <circle cx="580" cy="140" r="24" fill="#d4652a" stroke="#ffd700" stroke-width="3"/>
  <text x="580" y="146" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">v4</text>
  <text x="580" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">2025-2026</text>
  <text x="580" y="205" font-family="Arial" font-size="10" fill="#d4652a" text-anchor="middle" font-weight="bold">★ 最新</text>
  
  <!-- Future -->
  <circle cx="680" cy="140" r="14" fill="#ccc" stroke="#fff" stroke-width="2"/>
  <text x="680" y="145" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">...</text>
  <text x="680" y="185" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">次の</text>
  <text x="680" y="200" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">世代</text>

  <!-- Key features section -->
  <rect x="80" y="260" width="640" height="210" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1"/>
  <text x="400" y="290" font-family="Arial" font-size="16" font-weight="bold" fill="#d4652a" text-anchor="middle">ExpressLRS 4.0 主要新機能</text>
  
  <!-- Feature boxes -->
  <rect x="110" y="310" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="200" y="335" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">自由なアーム設定</text>
  <text x="200" y="355" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">CH5固定を解除</text>
  <text x="200" y="370" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">任意スイッチでARM</text>
  
  <rect x="310" y="310" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="400" y="335" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">スマートDyn Power</text>
  <text x="400" y="355" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">知的出力制御</text>
  <text x="400" y="370" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">自動アンテナ切替</text>
  
  <rect x="510" y="310" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="600" y="335" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">DJI AU Full Power</text>
  <text x="600" y="355" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">FC不要で最大出力</text>
  <text x="600" y="370" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">ダイレクトARM信号</text>

  <rect x="110" y="385" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="200" y="410" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">テレメトリ高速化</text>
  <text x="200" y="430" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">低遅延双方向通信</text>

  <rect x="310" y="385" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="400" y="410" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">新WebUI</text>
  <text x="400" y="430" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">ブラウザベース設定</text>

  <rect x="510" y="385" width="180" height="65" rx="6" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="600" y="410" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">サーボ出力拡張</text>
  <text x="600" y="430" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">固定翼ユーザ歓喜</text>

</svg>