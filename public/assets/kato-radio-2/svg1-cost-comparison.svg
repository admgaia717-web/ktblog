<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#f5f0eb;font-family:'Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="500" fill="#f5f0eb"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#d4652a">3Dプリンタ義手 vs 従来義手 — コスト比較</text>
  
  <!-- Traditional prosthetic bar -->
  <text x="60" y="85" font-size="14" font-weight="bold" fill="#333">従来の義手</text>
  <rect y="95" x="60" width="640" height="35" rx="5" fill="#8B4513" opacity="0.7"/>
  <text x="710" y="120" font-size="16" font-weight="bold" fill="#8B4513">100万〜500万円</text>
  <text x="620" y="115" font-size="12" fill="white" text-anchor="end">★★☆☆☆</text>
  
  <!-- 3D printed prosthetic bar -->
  <text x="60" y="155" font-size="14" font-weight="bold" fill="#333">3Dプリンタ義手</text>
  <rect y="165" x="60" width="8" height="35" rx="5" fill="#d4652a"/>
  <text x="72" y="190" font-size="16" font-weight="bold" fill="#d4652a">5,000〜20,000円</text>
  <text x="130" y="190" font-size="12" fill="#666">最大99%コスト削減</text>
  
  <!-- Divider -->
  <line x1="60" y1="220" x2="760" y2="220" stroke="#ccc" stroke-width="1"/>
  
  <!-- Time comparison -->
  <text x="400" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#d4652a">製作期間</text>
  
  <text x="60" y="280" font-size="14" fill="#333">従来: </text>
  <rect x="120" y="270" width="400" height="25" rx="4" fill="#8B4513" opacity="0.5"/>
  <text x="530" y="288" font-size="14" font-weight="bold" fill="#8B4513">3〜8週間</text>
  
  <text x="60" y="320" font-size="14" fill="#333">3Dプリント: </text>
  <rect x="150" y="310" width="40" height="25" rx="4" fill="#d4652a"/>
  <text x="200" y="328" font-size="14" font-weight="bold" fill="#d4652a">1〜3日</text>
  <text x="320" y="328" font-size="12" fill="#666">90%短縮</text>
  
  <!-- Divider -->
  <line x1="60" y1="350" x2="760" y2="350" stroke="#ccc" stroke-width="1"/>
  
  <!-- Key metrics -->
  <text x="400" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#d4652a">e-NABLEコミュニティの実績</text>
  
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#d4652a" opacity="0.15" stroke="#d4652a" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="22" font-weight="bold" fill="#d4652a">15,000+</text>
    <text x="90" y="40" text-anchor="middle" font-size="11" fill="#333">配布義手</text>
  </g>
  <g transform="translate(290, 390)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#d4652a" opacity="0.15" stroke="#d4652a" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="22" font-weight="bold" fill="#d4652a">10,000+</text>
    <text x="90" y="40" text-anchor="middle" font-size="11" fill="#333">参加ボランティア</text>
  </g>
  <g transform="translate(500, 390)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#d4652a" opacity="0.15" stroke="#d4652a" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="22" font-weight="bold" fill="#d4652a">230+</text>
    <text x="90" y="40" text-anchor="middle" font-size="11" fill="#333">対象国・地域</text>
  </g>
  
  <!-- Source note -->
  <text x="400" y="480" text-anchor="middle" font-size="10" fill="#999">出典: e-NABLE Community Foundation Annual Report 2026 | 加藤ラジコン出版</text>
</svg>
