<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      .bg { fill: #f5f0eb; }
      .card { fill: #ffffff; stroke: #d4652a; stroke-width: 1; }
      .h-en { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 24px; font-weight: 700; fill: #2a2a2a; }
      .h-jp { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 14px; fill: #6a6a6a; }
      .body { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 14px; fill: #2a2a2a; }
      .caption { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 12px; font-style: italic; fill: #6a6a6a; }
      .divider { stroke: #d4652a; stroke-width: 2; }
      .node-title { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .node-text { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 11px; fill: #ffffff; }
      .arrow { stroke: #d4652a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .center-node { fill: #d4652a; stroke: #b85522; stroke-width: 2; }
      .sub-node { fill: #4a4a4a; stroke: #6a6a6a; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4652a"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="480"/>
  <rect class="card" x="20" y="20" width="760" height="440" rx="8"/>
  <text class="h-en" x="40" y="60">S-DiY Bionic Butterfly</text>
  <text class="h-jp" x="40" y="85">プロジェクト概要 — オープンソースRC羽ばたき蝶</text>
  <line class="divider" x1="40" y1="100" x2="760" y2="100"/>

  <!-- Center node: Butterfly -->
  <rect class="center-node" x="320" y="180" width="160" height="60" rx="8"/>
  <text class="node-title" x="400" y="208" text-anchor="middle">RC Bionic Butterfly</text>
  <text class="node-text" x="400" y="226" text-anchor="middle">Servo Direct Drive</text>

  <!-- Top-left: YouTube -->
  <rect class="sub-node" x="40" y="130" width="180" height="70" rx="6"/>
  <text class="node-title" x="130" y="155" text-anchor="middle">▶ YouTube S-DiY</text>
  <text class="node-text" x="130" y="173" text-anchor="middle">ベトナム / 13.7万登録者</text>
  <text class="node-text" x="130" y="189" text-anchor="middle">14万再生 / 4ヶ月</text>
  <line class="arrow" x1="220" y1="165" x2="318" y2="185"/>

  <!-- Top-right: GitHub -->
  <rect class="sub-node" x="580" y="130" width="180" height="70" rx="6"/>
  <text class="node-title" x="670" y="155" text-anchor="middle">⌨ GitHub OSS</text>
  <text class="node-text" x="670" y="173" text-anchor="middle">wonderworksr/butterfly</text>
  <text class="node-text" x="670" y="189" text-anchor="middle">Arduinoスケッチ + STL</text>
  <line class="arrow" x1="580" y1="165" x2="482" y2="185"/>

  <!-- Bottom-left: Media -->
  <rect class="sub-node" x="40" y="330" width="180" height="70" rx="6"/>
  <text class="node-title" x="130" y="355" text-anchor="middle">📰 メディア掲載</text>
  <text class="node-text" x="130" y="373" text-anchor="middle">Circuit Digest</text>
  <text class="node-text" x="130" y="389" text-anchor="middle">PCB HERO (Licky's Column)</text>
  <line class="arrow" x1="220" y1="365" x2="318" y2="245"/>

  <!-- Bottom-right: Community -->
  <rect class="sub-node" x="580" y="330" width="180" height="70" rx="6"/>
  <text class="node-title" x="670" y="355" text-anchor="middle">👥 コミュニティ</text>
  <text class="node-text" x="670" y="373" text-anchor="middle">CTorque DIY Community</text>
  <text class="node-text" x="670" y="389" text-anchor="middle">Facebook 872人 / Forkあり</text>
  <line class="arrow" x1="580" y1="365" x2="482" y2="245"/>

  <text class="caption" x="40" y="440">出典: S-DiY (YouTube), GitHub, 各種メディア 2026</text>
</svg>
