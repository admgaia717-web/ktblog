<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      .bg { fill: #f5f0eb; }
      .card { fill: #ffffff; stroke: #d4652a; stroke-width: 1; }
      .h-en { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 24px; font-weight: 700; fill: #2a2a2a; }
      .h-jp { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 14px; fill: #6a6a6a; }
      .body { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 13px; fill: #2a2a2a; }
      .caption { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 12px; font-style: italic; fill: #6a6a6a; }
      .divider { stroke: #d4652a; stroke-width: 2; }
      .title-left { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #6a6a6a; }
      .title-right { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #d4652a; }
      .comp-item { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 12px; fill: #2a2a2a; }
      .comp-label { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #6a6a6a; }
      .box-gear { fill: #f0e8e0; stroke: #6a6a6a; stroke-width: 1; }
      .box-servo { fill: #fdf0ea; stroke: #d4652a; stroke-width: 1; }
      .motor { fill: #6a6a6a; stroke: #4a4a4a; stroke-width: 1; }
      .gear { fill: #8a8a8a; stroke: #6a6a6a; stroke-width: 1; }
      .link { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .wing { fill: #8B4513; fill-opacity: 0.3; stroke: #8B4513; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="800" height="480"/>
  <rect class="card" x="20" y="20" width="760" height="440" rx="8"/>
  <text class="h-en" x="40" y="60">Gear Drive vs Servo Drive</text>
  <text class="h-jp" x="40" y="85">2つの駆動方式 — 従来型ギア式とサーボ式直接駆動の比較</text>
  <line class="divider" x1="40" y1="100" x2="760" y2="100"/>

  <!-- LEFT: Gear Drive -->
  <rect class="box-gear" x="30" y="115" width="350" height="310" rx="6"/>
  <text class="title-left" x="205" y="142" text-anchor="middle">⚙ Gear Drive（ギア式）</text>

  <!-- Motor -->
  <rect class="motor" x="55" y="160" width="50" height="40" rx="4"/>
  <text class="comp-item" x="80" y="184" text-anchor="middle">モーター</text>

  <!-- Gear box -->
  <rect class="gear" x="130" y="155" width="70" height="50" rx="4"/>
  <circle cx="150" cy="180" r="8" fill="none" stroke="#6a6a6a" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="12" fill="none" stroke="#6a6a6a" stroke-width="1.5"/>
  <text class="comp-item" x="165" y="220" text-anchor="middle">ギアボックス</text>

  <!-- Crank -->
  <circle cx="180" cy="180" r="4" fill="#d4652a"/>
  <line class="link" x1="220" y1="180" x2="260" y2="160"/>

  <!-- Wing -->
  <path class="wing" d="M 260 155 Q 300 140 350 130 Q 360 120 370 130 Q 340 150 300 165 Q 270 170 260 155 Z"/>

  <!-- Components list -->
  <text class="comp-label" x="55" y="255">構成部品:</text>
  <text class="comp-item" x="55" y="275">• モーター + ギア減速</text>
  <text class="comp-item" x="55" y="295">• クランク・コンロッド</text>
  <text class="comp-item" x="55" y="315">• 左右同期（機械的）</text>
  <text class="comp-item" x="55" y="335">• 部品点数 多 / 重量 重</text>
  <text class="comp-item" x="55" y="355">• 調整に機械加工必要</text>
  <text class="comp-item" x="55" y="375">• 出力大・大型機対応</text>

  <!-- RIGHT: Servo Drive -->
  <rect class="box-servo" x="410" y="115" width="360" height="310" rx="6"/>
  <text class="title-right" x="590" y="142" text-anchor="middle">🔌 Servo Drive（サーボ式）</text>

  <!-- Arduino -->
  <rect class="motor" x="435" y="160" width="50" height="40" rx="4" fill="#6a9fb5" stroke="#4a7a8a"/>
  <text class="comp-item" x="460" y="184" text-anchor="middle">Arduino</text>

  <!-- Servo -->
  <rect class="gear" x="510" y="155" width="60" height="50" rx="4" fill="#d4652a" stroke="#b85522"/>
  <text class="comp-item" x="540" y="220" text-anchor="middle">サーボ</text>

  <!-- Direct line -->
  <line class="link" x1="570" y1="180" x2="610" y2="160" stroke="#d4652a" stroke-width="3"/>

  <!-- Wing -->
  <path class="wing" d="M 610 155 Q 650 140 700 130 Q 710 120 720 130 Q 690 150 650 165 Q 620 170 610 155 Z"/>

  <!-- Components list -->
  <text class="comp-label" x="435" y="255">構成部品:</text>
  <text class="comp-item" x="435" y="275">• Arduino Pro Micro（5g）</text>
  <text class="comp-item" x="435" y="295">• サーボ×2（13g×2）</text>
  <text class="comp-item" x="435" y="315">• 左右独立制御可能</text>
  <text class="comp-item" x="435" y="335">• 部品点数 最少 / 超軽量</text>
  <text class="comp-item" x="435" y="355">• 調整はコード変更のみ</text>
  <text class="comp-item" x="435" y="375">• 小型機専用・蝶型に最適</text>

  <!-- Bottom annotation -->
  <text class="caption" x="400" y="430" text-anchor="middle">S-DiYプロジェクトはServo Drive方式を採用 — 55-61gの超軽量化に成功</text>
</svg>
