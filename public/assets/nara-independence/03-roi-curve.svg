<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">投資回収シミュレーション——累積収支</text>
  
  <g transform="translate(60, 80)">
    <!-- 軸 -->
    <line x1="0" y1="300" x2="700" y2="300" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="0" y2="300" stroke="#333" stroke-width="1.5"/>
    
    <!-- Y軸ラベル -->
    <text x="-15" y="300" text-anchor="end" font-size="11" fill="#555">0</text>
    <text x="-15" y="230" text-anchor="end" font-size="11" fill="#555">-1億</text>
    <text x="-15" y="160" text-anchor="end" font-size="11" fill="#555">-2億</text>
    <text x="-15" y="90" text-anchor="end" font-size="11" fill="#555">-3億</text>
    <text x="-15" y="40" text-anchor="end" font-size="11" fill="#555">-4億</text>
    
    <!-- X軸ラベル -->
    <text x="0" y="320" text-anchor="middle" font-size="11" fill="#555">投資</text>
    <text x="100" y="320" text-anchor="middle" font-size="11" fill="#555">1年後</text>
    <text x="200" y="320" text-anchor="middle" font-size="11" fill="#555">2年後</text>
    <text x="300" y="320" text-anchor="middle" font-size="11" fill="#555">3年後</text>
    <text x="400" y="320" text-anchor="middle" font-size="11" fill="#555">4年後</text>
    <text x="500" y="320" text-anchor="middle" font-size="11" fill="#555">5年後</text>
    <text x="650" y="320" text-anchor="middle" font-size="11" fill="#555">10年後</text>
    
    <!-- グリッド -->
    <line x1="0" y1="230" x2="700" y2="230" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="160" x2="700" y2="160" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="90" x2="700" y2="90" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="40" x2="700" y2="40" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    
    <!-- 垂直グリッド -->
    <line x1="100" y1="40" x2="100" y2="300" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="40" x2="200" y2="300" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="300" y1="40" x2="300" y2="300" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="400" y1="40" x2="400" y2="300" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="500" y1="40" x2="500" y2="300" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
    
    <!-- 累積収支ライン -->
    <polyline points="0,40 70,105 170,130 270,60 370,-10 470,-70 670,-320" 
              fill="none" stroke="#8b0000" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- データ点 -->
    <circle cx="0" cy="40" r="6" fill="#8b0000"/>
    <circle cx="70" cy="105" r="5" fill="#8b0000"/>
    <circle cx="170" cy="130" r="5" fill="#8b0000"/>
    <circle cx="270" cy="60" r="5" fill="#8b0000"/>
    <circle cx="370" cy="-10" r="5" fill="#8b0000"/>
    <circle cx="470" cy="-70" r="5" fill="#8b0000"/>
    <circle cx="670" cy="-320" r="6" fill="#8b0000"/>
    
    <!-- 値ラベル -->
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#8b0000" font-weight="bold">▲4.0億</text>
    <text x="70" y="95" text-anchor="middle" font-size="11" fill="#8b0000">▲3.4億</text>
    <text x="170" y="145" text-anchor="middle" font-size="11" fill="#8b0000">▲2.6億</text>
    <text x="270" y="50" text-anchor="middle" font-size="11" fill="#8b0000">▲0.7億</text>
    <text x="370" y="-25" text-anchor="middle" font-size="12" fill="#2d6a4f" font-weight="bold">+1.2億</text>
    <text x="470" y="-85" text-anchor="middle" font-size="12" fill="#2d6a4f">+3.1億</text>
    <text x="670" y="-340" text-anchor="middle" font-size="14" fill="#2d6a4f" font-weight="bold">+16.0億</text>
    
    <!-- 回収点 -->
    <line x1="255" y1="300" x2="255" y2="70" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="255" y="340" text-anchor="middle" font-size="12" fill="#b8860b">約2.5年で回収</text>
  </g>
  
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#888">20年で累積40億円の純利益——しかも文化は保存され続ける</text>
</svg>
