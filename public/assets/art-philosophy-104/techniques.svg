<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f5f0eb"/>
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#d4652a">ストリートアート技法マップ</text>

  <!-- Central node -->
  <circle cx="400" cy="150" r="45" fill="#d4652a"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">ストリート</text>
  <text x="400" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">アート</text>

  <!-- Connected techniques -->
  <!-- 1: ステンシル -->
  <rect x="40" y="230" width="180" height="70" rx="8" fill="#fff" stroke="#d4652a" stroke-width="1.5"/>
  <line x1="310" y1="180" x2="220" y2="240" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">🎨 ステンシル</text>
  <text x="130" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">型紙+スプレー</text>
  <text x="130" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">バンクシー</text>

  <!-- 2: ウィートペースト -->
  <rect x="310" y="230" width="180" height="70" rx="8" fill="#fff" stroke="#d4652a" stroke-width="1.5"/>
  <line x1="400" y1="195" x2="400" y2="230" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">📄 ウィートペースト</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">接着剤+ポスター</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">シェパード・フェアリー</text>

  <!-- 3: モザイク -->
  <rect x="580" y="230" width="180" height="70" rx="8" fill="#fff" stroke="#d4652a" stroke-width="1.5"/>
  <line x1="490" y1="180" x2="580" y2="240" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="670" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">🧩 モザイク</text>
  <text x="670" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">タイル貼り</text>
  <text x="670" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">Invader</text>

  <!-- 4: ヤーンボミング -->
  <rect x="140" y="330" width="220" height="70" rx="8" fill="#fff" stroke="#d4652a" stroke-width="1.5"/>
  <line x1="250" y1="300" x2="250" y2="330" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">🧶 ヤーンボミング</text>
  <text x="250" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">編物で街を飾る</text>
  <text x="250" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">Magda Sayeg</text>

  <!-- 5: LED/AR -->
  <rect x="440" y="330" width="220" height="70" rx="8" fill="#fff" stroke="#d4652a" stroke-width="1.5"/>
  <line x1="500" y1="300" x2="500" y2="330" stroke="#d4652a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="550" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">💡 LED/AR</text>
  <text x="550" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">デジタル投影</text>
  <text x="550" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">プロジェクション・マッピング</text>
</svg>
