<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#f5f0eb"/>
  <text x="450" y="35" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333">各国協働ロボット導入比率（全産業用ロボットに占める割合 %）</text>
  <rect x="60" y="480-90" width="120" height="90" rx="3" fill="#d4652a" transform="translate(0, -390)"/>
  <text x="120" y="480-90-10" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#d4652a">8.2%</text>
  <text x="120" y="110" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#333">🇩🇪 ドイツ</text>
  <rect x="220" y="480-78" width="120" height="78" rx="3" fill="#e07b3a" transform="translate(0, -390)"/>
  <text x="280" y="480-78-10" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#e07b3a">7.1%</text>
  <text x="280" y="110" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#333">🇺🇸 アメリカ</text>
  <rect x="380" y="480-75" width="120" height="75" rx="3" fill="#d4652a" transform="translate(0, -390)"/>
  <text x="440" y="480-75-10" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#d4652a">6.8%</text>
  <text x="440" y="110" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#333">🇨🇳 中国</text>
  <rect x="540" y="480-45" width="120" height="45" rx="3" fill="#f0a86a" transform="translate(0, -390)"/>
  <text x="600" y="480-45-10" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#f0a86a">4.1%</text>
  <text x="600" y="110" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#333">🇰🇷 韓国</text>
  <rect x="700" y="480-38" width="120" height="38" rx="3" fill="#c0392b" transform="translate(0, -390)"/>
  <text x="760" y="480-38-10" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#c0392b">3.5%</text>
  <text x="760" y="110" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#333">🇯🇵 日本</text>
  <text x="450" y="150" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888">日本はロボット大国ながら協働ロボット導入率は主要国で最低</text>
  <text x="760" y="175" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#c0392b">→ 2026年40%増で挽回中</text>
  <text x="450" y="480" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#aaa">出典：IFR World Robotics Report 2025</text>
</svg>