<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">予算内訳と財源構成</text>
  
  <g transform="translate(60, 80)">
    <!-- 積み上げ横棒グラフ（支出） -->
    <text x="0" y="25" font-size="14" font-weight="bold" fill="#333">支出内訳（最大3500万円）</text>
    
    <rect x="0" y="40" width="220" height="30" fill="#b8860b" rx="4"/>
    <text x="10" y="60" font-size="12" fill="#fff" font-weight="bold">データ準備</text>
    <text x="230" y="60" font-size="12" fill="#b8860b">300〜800万円</text>
    
    <rect x="0" y="80" width="320" height="30" fill="#8b0000" rx="4"/>
    <text x="10" y="100" font-size="12" fill="#fff" font-weight="bold">GPUクラウド（学習）</text>
    <text x="330" y="100" font-size="12" fill="#8b0000">500〜1200万円</text>
    
    <rect x="0" y="120" width="140" height="30" fill="#4a6fa5" rx="4"/>
    <text x="10" y="140" font-size="12" fill="#fff">技術指導</text>
    <text x="150" y="140" font-size="12" fill="#4a6fa5">200〜500万円</text>
    
    <rect x="0" y="160" width="80" height="30" fill="#2d6a4f" rx="4"/>
    <text x="10" y="180" font-size="12" fill="#fff">評価調整</text>
    <text x="90" y="180" font-size="12" fill="#2d6a4f">100〜300万円</text>
    
    <rect x="0" y="200" width="200" height="30" fill="#ea907a" rx="4"/>
    <text x="10" y="220" font-size="12" fill="#fff">インフラ構築</text>
    <text x="210" y="220" font-size="12" fill="#ea907a">200〜700万円</text>
    
    <!-- 財源構成（円グラフ） -->
    <g transform="translate(500, 110)">
      <text x="0" y="-80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">財源構成</text>
      
      <!-- 75% 交付金 -->
      <path d="M0,0 L0,-80 A80,80 0 0,1 69.3,40 Z" fill="#2d4059"/>
      <text x="30" y="-20" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">75%</text>
      <text x="30" y="-5" text-anchor="middle" font-size="9" fill="#fff">交付金</text>
      
      <!-- 12.5% 一般会計 -->
      <path d="M0,0 L69.3,40 A80,80 0 0,1 -24.5,76.1 Z" fill="#ea907a"/>
      <text x="35" y="65" text-anchor="middle" font-size="10" fill="#333">12.5%</text>
      
      <!-- 12.5% ふるさと納税 -->
      <path d="M0,0 L-24.5,76.1 A80,80 0 0,1 -80,0 Z" fill="#b8860b"/>
      <text x="-45" y="50" text-anchor="middle" font-size="10" fill="#333">12.5%</text>
      
      <circle cx="0" cy="0" r="25" fill="#fafaf7"/>
      <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#555">3500</text>
      <text x="0" y="8" text-anchor="middle" font-size="9" fill="#555">万円</text>
    </g>
  </g>
  
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#888">市の実質負担は約437万円〜875万円（一般会計2300億円の0.002%〜0.004%）</text>
</svg>
