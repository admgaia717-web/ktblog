<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">AI開発費の比較（対数スケール・推定）</text>
  
  <g transform="translate(60, 80)">
    <!-- OpenAI -->
    <rect x="20" y="30" width="40" height="300" fill="#1a1a2e" rx="4"/>
    <text x="40" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">OpenAI</text>
    <text x="40" y="340" text-anchor="middle" font-size="11" fill="#666">〜数千億</text>
    
    <!-- Google -->
    <rect x="80" y="30" width="40" height="300" fill="#1a1a2e" rx="4"/>
    <text x="100" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Google</text>
    <text x="100" y="340" text-anchor="middle" font-size="11" fill="#666">〜数千億</text>
    
    <!-- Qwen 3.5 -->
    <rect x="140" y="110" width="40" height="220" fill="#2d4059" rx="4"/>
    <text x="160" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Qwen</text>
    <text x="160" y="340" text-anchor="middle" font-size="11" fill="#666">数百億</text>
    
    <!-- NTT tsuzumi -->
    <rect x="200" y="170" width="40" height="160" fill="#4a6fa5" rx="4"/>
    <text x="220" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">NTT</text>
    <text x="220" y="340" text-anchor="middle" font-size="11" fill="#666">数十億</text>
    
    <!-- 源内 -->
    <rect x="260" y="210" width="40" height="120" fill="#ea907a" rx="4"/>
    <text x="280" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">源内</text>
    <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">44億</text>
    
    <!-- Rio 3.5 -->
    <rect x="340" y="320" width="60" height="10" fill="#8b0000" rx="4"/>
    <text x="370" y="350" text-anchor="middle" font-size="14" fill="#8b0000" font-weight="bold">★ Rio 3.5</text>
    <text x="370" y="370" text-anchor="middle" font-size="13" fill="#8b0000">2000万円</text>
    
    <!-- ならしLLM -->
    <rect x="460" y="310" width="60" height="20" fill="#b8860b" rx="4"/>
    <text x="490" y="350" text-anchor="middle" font-size="14" fill="#b8860b" font-weight="bold">★ ならしLLM</text>
    <text x="490" y="370" text-anchor="middle" font-size="13" fill="#b8860b">1300〜3500万円</text>
    
    <!-- 矢印注釈 -->
    <line x1="370" y1="295" x2="370" y2="285" stroke="#8b0000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="370" y="278" text-anchor="middle" font-size="11" fill="#8b0000">30倍以上安い</text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b0000"/>
    </marker>
  </defs>
  
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#888">※ 実際の開発費は非公開のため、公表情報からの推定値を含む</text>
</svg>
