<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">「ならし循環経済」の好循環</text>
  
  <g transform="translate(400, 250)">
    <!-- 中心: 奈良LLM -->
    <circle cx="0" cy="0" r="50" fill="#8b0000"/>
    <text x="0" y="-8" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">奈良</text>
    <text x="0" y="12" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">LLM</text>
    
    <!-- 矢印で結ぶ4つのノード -->
    
    <!-- 上: 文化保存 -->
    <rect x="-80" y="-160" width="160" height="55" fill="#fff5e6" stroke="#b8860b" stroke-width="2" rx="8"/>
    <text x="0" y="-140" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b0000">📜 文化保存</text>
    <text x="0" y="-122" text-anchor="middle" font-size="11" fill="#555">1300年のデータを</text>
    <text x="0" y="-108" text-anchor="middle" font-size="11" fill="#555">AIで継承</text>
    <line x1="0" y1="-50" x2="0" y2="-100" stroke="#8b0000" stroke-width="2" marker-end="url(#ar3)"/>
    
    <!-- 右: コスト削減 -->
    <rect x="150" y="-80" width="160" height="55" fill="#e8f0e8" stroke="#2d6a4f" stroke-width="2" rx="8"/>
    <text x="230" y="-60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">💰 コスト削減</text>
    <text x="230" y="-42" text-anchor="middle" font-size="11" fill="#555">外部APIの</text>
    <text x="230" y="-28" text-anchor="middle" font-size="11" fill="#555">30倍効率</text>
    <line x1="50" y1="0" x2="145" y2="0" stroke="#8b0000" stroke-width="2" marker-end="url(#ar3)"/>
    
    <!-- 下: オープンソース -->
    <rect x="-80" y="110" width="160" height="55" fill="#f0e8f5" stroke="#6a4fa5" stroke-width="2" rx="8"/>
    <text x="0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a4fa5">🖥️ オープンソース</text>
    <text x="0" y="148" text-anchor="middle" font-size="11" fill="#555">Microsoftから脱却</text>
    <text x="0" y="162" text-anchor="middle" font-size="11" fill="#555">年1.5億円→ゼロ</text>
    <line x1="0" y1="50" x2="0" y2="105" stroke="#8b0000" stroke-width="2" marker-end="url(#ar3)"/>
    
    <!-- 左: 地域再投資 -->
    <rect x="-310" y="-80" width="160" height="55" fill="#e8f0f8" stroke="#4a6fa5" stroke-width="2" rx="8"/>
    <text x="-230" y="-60" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6fa5">🔄 地域再投資</text>
    <text x="-230" y="-42" text-anchor="middle" font-size="11" fill="#555">削減分をIT人材</text>
    <text x="-230" y="-28" text-anchor="middle" font-size="11" fill="#555">と文化継承に</text>
    <line x1="-50" y1="0" x2="-145" y2="0" stroke="#8b0000" stroke-width="2" marker-end="url(#ar3)"/>
    
    <!-- 外側の循環矢印 -->
    <path d="M 0 -175 A 175 175 0 0 1 170 -35" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <path d="M 175 35 A 175 175 0 0 1 0 180" fill="none" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5,3"/>
    <path d="M 0 185 A 175 175 0 0 1 -170 35" fill="none" stroke="#6a4fa5" stroke-width="1.5" stroke-dasharray="5,3"/>
    <path d="M -175 -35 A 175 175 0 0 1 0 -175" fill="none" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <text x="90" y="-115" text-anchor="middle" font-size="10" fill="#b8860b">文化→削減</text>
    <text x="110" y="130" text-anchor="middle" font-size="10" fill="#2d6a4f">削減→OSS</text>
    <text x="-90" y="135" text-anchor="middle" font-size="10" fill="#6a4fa5">OSS→再投資</text>
    <text x="-90" y="-115" text-anchor="middle" font-size="10" fill="#4a6fa5">再投資→文化</text>
  </g>
  
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b0000"/>
    </marker>
  </defs>
  
  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#888">奈良LLMを核に、文化保存・コスト削減・オープンソース・地域再投資が好循環する</text>
</svg>
