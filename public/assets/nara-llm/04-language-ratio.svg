<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">インターネット上の言語データ比率</text>
  
  <g transform="translate(400, 260)">
    <!-- 英語 60% -->
    <path d="M0,0 L0,-220 A220,220 0 0,1 190.5,110 Z" fill="#1a1a2e"/>
    <text x="70" y="-80" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">英語</text>
    <text x="70" y="-60" text-anchor="middle" font-size="13" fill="#ddd">60%</text>
    
    <!-- 中国語 15% -->
    <path d="M0,0 L190.5,110 A220,220 0 0,1 55.4,213 Z" fill="#2d4059"/>
    <text x="140" y="170" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">中国語</text>
    <text x="140" y="188" text-anchor="middle" font-size="12" fill="#ddd">15%</text>
    
    <!-- スペイン語 5% -->
    <path d="M0,0 L55.4,213 A220,220 0 0,1 -43,215.8 Z" fill="#4a6fa5"/>
    <text x="0" y="220" text-anchor="middle" font-size="12" fill="#fff">西語 5%</text>
    
    <!-- その他 18% -->
    <path d="M0,0 L-43,215.8 A220,220 0 0,1 -190.5,110 Z" fill="#ea907a"/>
    <text x="-100" y="180" text-anchor="middle" font-size="13" fill="#333">その他</text>
    <text x="-100" y="198" text-anchor="middle" font-size="12" fill="#555">18%</text>
    
    <!-- 日本語 2% -->
    <path d="M0,0 L-190.5,110 A220,220 0 0,1 -220,0 Z" fill="#8b0000"/>
    <text x="-145" y="50" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">日本語</text>
    <text x="-145" y="68" text-anchor="middle" font-size="12" fill="#fff">約2%</text>
    
    <circle cx="0" cy="0" r="60" fill="#fafaf7"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#888">AIの</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" fill="#888">学習データ</text>
  </g>
  
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#888">出典: Common Crawl統計、W3Techs調査に基づく推定値（2025-2026年）</text>
</svg>
