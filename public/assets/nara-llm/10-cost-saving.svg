<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fafaf7" rx="8"/>
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#2c2c2c">オープンソース移行によるコスト削減効果</text>
  
  <g transform="translate(60, 80)">
    <!-- フランス憲兵隊 -->
    <rect x="0" y="0" width="300" height="80" fill="#fff5e6" stroke="#b8860b" stroke-width="1.5" rx="6"/>
    <text x="150" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b0000">🇫🇷 フランス憲兵隊</text>
    <text x="150" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8860b">年間200万€</text>
    <text x="150" y="68" text-anchor="middle" font-size="12" fill="#555">約3.4億円削減（10.3万台）</text>
    
    <!-- ドイツ州 -->
    <rect x="340" y="0" width="300" height="80" fill="#fff5e6" stroke="#b8860b" stroke-width="1.5" rx="6"/>
    <text x="490" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b0000">🇩🇪 シュレスヴィヒ＝</text>
    <text x="490" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b0000">ホルシュタイン州</text>
    <text x="490" y="68" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8860b">年間1500万€</text>
    
    <!-- 奈良市試算 -->
    <rect x="100" y="130" width="440" height="90" fill="#fff" stroke="#8b0000" stroke-width="2.5" rx="8" stroke-dasharray="6,3"/>
    <text x="320" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#8b0000">🇯🇵 奈良市（試算）</text>
    
    <text x="220" y="185" font-size="14" fill="#333">職員約3000人 × 年5万円 = </text>
    <text x="430" y="185" font-size="16" font-weight="bold" fill="#8b0000">年1.5億円</text>
    <text x="320" y="210" text-anchor="middle" font-size="13" fill="#555">オープンソース移行で50%削減 → 年7500万円浮く</text>
    
    <!-- 矢印でつなぐ -->
    <path d="M 320 90 L 320 120" stroke="#8b0000" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar2)"/>
    
    <text x="320" y="280" text-anchor="middle" font-size="13" fill="#888">「削減したライセンス費用を奈良LLMの維持・改善に再投資」</text>
    <text x="320" y="300" text-anchor="middle" font-size="13" fill="#888">→ ならし循環経済の完成</text>
  </g>
  
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b0000"/>
    </marker>
  </defs>
  
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#888">出典: TechHQ (2026年4月), The Next Web (2026年4月), 及び奈良市試算</text>
</svg>
