<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#f5f0eb"/>
  <text x="450" y="35" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#333">作者概念の変遷 - 三つの時代</text>
  <rect x="30" y="70" width="260" height="410" rx="10" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="30" y="70" width="260" height="45" rx="10" fill="#333"/>
  <rect x="30" y="95" width="260" height="20" fill="#333"/>
  <text x="160" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">伝統的作者</text>
  <text x="160" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#888">18Cロマン主義-20C前半</text>
  <text x="50" y="185" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333" font-weight="bold">核心:</text>
  <text x="50" y="205" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">作者 = 天才 / 創造主</text>
  <text x="50" y="225" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">作品の意味は作者が決める</text>
  <rect x="320" y="70" width="260" height="410" rx="10" fill="#fff" stroke="#d4652a" stroke-width="2"/>
  <rect x="320" y="70" width="260" height="45" rx="10" fill="#d4652a"/>
  <rect x="320" y="95" width="260" height="20" fill="#d4652a"/>
  <text x="450" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">死んだ作者</text>
  <text x="450" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#888">1960s-2010s</text>
  <text x="340" y="185" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333" font-weight="bold">核心:</text>
  <text x="340" y="205" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">作者 != 作品の意味決定者</text>
  <text x="340" y="225" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">読者が意味を創造する</text>
  <rect x="610" y="70" width="260" height="410" rx="10" fill="#fff" stroke="#1a237e" stroke-width="2"/>
  <rect x="610" y="70" width="260" height="45" rx="10" fill="#1a237e"/>
  <rect x="610" y="95" width="260" height="20" fill="#1a237e"/>
  <text x="740" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">AI時代の作者</text>
  <text x="740" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#888">2022-</text>
  <text x="630" y="185" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333" font-weight="bold">核心:</text>
  <text x="630" y="205" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">作者 = 選択者+編集者</text>
  <text x="630" y="225" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">人間+AIのハイブリッド</text>
  <text x="450" y="495" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#999">加藤ラジコン出版 | art-philosophy-98</text>
</svg>