  <text x="560" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">価格で価値を定義</text>
  <rect x="670" y="270" width="180" height="80" rx="8" fill="#fff" stroke="#1a237e" stroke-width="2"/>
  <text x="760" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a237e">AI / アルゴリズム</text>
  <text x="760" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">レコメンドが可視性決定</text>
  <text x="450" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#999">加藤ラジコン出版 | art-philosophy-98</text>
