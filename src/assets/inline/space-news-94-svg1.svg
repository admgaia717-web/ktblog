<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#e8e0d6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4652a"/>
      <stop offset="100%" stop-color="#e8854a"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a5f8a"/>
      <stop offset="100%" stop-color="#4a8fc4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#333">スターシップ開発年表 — 2019→2026</text>
  
  <!-- Timeline line -->
  <line x1="80" y1="80" x2="750" y2="80" stroke="#d4652a" stroke-width="3"/>
  
  <!-- 2019 Starhopper -->
  <circle cx="120" cy="80" r="8" fill="#d4652a"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#555">2019</text>
  <text x="120" y="125" text-anchor="middle" font-size="10" fill="#777">Starhopper</text>
  <text x="120" y="138" text-anchor="middle" font-size="9" fill="#999">150m飛行</text>
  
  <!-- 2021 SN15 -->
  <circle cx="220" cy="80" r="8" fill="#d4652a"/>
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#555">2021</text>
  <text x="220" y="125" text-anchor="middle" font-size="10" fill="#777">SN15 (V1)</text>
  <text x="220" y="138" text-anchor="middle" font-size="9" fill="#999">軌道試験</text>
  
  <!-- 2023 Flight 5 -->
  <circle cx="340" cy="80" r="8" fill="#2a5f8a"/>
  <text x="340" y="110" text-anchor="middle" font-size="11" fill="#555">2023</text>
  <text x="340" y="125" text-anchor="middle" font-size="10" fill="#777">Flight 5 (V2)</text>
  <text x="340" y="138" text-anchor="middle" font-size="9" fill="#999">捕捉成功</text>
  
  <!-- 2024 Flights 6-10 -->
  <circle cx="440" cy="80" r="8" fill="#2a5f8a"/>
  <text x="440" y="110" text-anchor="middle" font-size="11" fill="#555">2024</text>
  <text x="440" y="125" text-anchor="middle" font-size="10" fill="#777">Flight 6-10</text>
  <text x="440" y="138" text-anchor="middle" font-size="9" fill="#999">V2運用化</text>
  
  <!-- 2025 Flights 11 -->
  <circle cx="540" cy="80" r="8" fill="#2a5f8a"/>
  <text x="540" y="110" text-anchor="middle" font-size="11" fill="#555">2025</text>
  <text x="540" y="125" text-anchor="middle" font-size="10" fill="#777">Flight 11</text>
  <text x="540" y="138" text-anchor="middle" font-size="9" fill="#999">V2.5改良</text>
  
  <!-- 2026 Flight 12 (V3) -->
  <circle cx="630" cy="80" r="10" fill="#d4652a" stroke="#b8551a" stroke-width="2"/>
  <text x="630" y="110" text-anchor="middle" font-size="11" fill="#555">2026.5</text>
  <text x="630" y="125" text-anchor="middle" font-size="10" fill="#d4652a" font-weight="bold">Flight 12 (V3)</text>
  <text x="630" y="138" text-anchor="middle" font-size="9" fill="#999">初V3飛行</text>
  
  <!-- 2026 Flight 13 NOW -->
  <circle cx="720" cy="80" r="12" fill="#d4652a" stroke="#ff0000" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="720" y="110" text-anchor="middle" font-size="11" fill="#d4652a" font-weight="bold">2026.7</text>
  <text x="720" y="125" text-anchor="middle" font-size="10" fill="#d4652a" font-weight="bold">★ Flight 13</text>
  <text x="720" y="138" text-anchor="middle" font-size="9" fill="#d4652a">V3再挑戦</text>
  
  <!-- Metrics bar chart -->
  <text x="400" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">主要性能比較</text>
  
  <!-- V2 vs V3 -->
  <text x="200" y="225" text-anchor="middle" font-size="12" fill="#2a5f8a" font-weight="bold">V2</text>
  <text x="600" y="225" text-anchor="middle" font-size="12" fill="#d4652a" font-weight="bold">V3</text>
  
  <!-- Thrust -->
  <text x="80" y="260" font-size="11" fill="#555">推力 (t)</text>
  <rect x="150" y="245" width="100" height="15" fill="#2a5f8a" rx="3"/>
  <text x="255" y="256" font-size="10" fill="#2a5f8a">6,300t</text>
  <rect x="350" y="245" width="130" height="15" fill="#d4652a" rx="3"/>
  <text x="485" y="256" font-size="10" fill="#d4652a">7,590t (+20%)</text>
  
  <!-- Payload -->
  <text x="80" y="295" font-size="11" fill="#555">搭載量 (t)</text>
  <rect x="150" y="280" width="80" height="15" fill="#2a5f8a" rx="3"/>
  <text x="235" y="291" font-size="10" fill="#2a5f8a">100t</text>
  <rect x="350" y="280" width="120" height="15" fill="#d4652a" rx="3"/>
  <text x="475" y="291" font-size="10" fill="#d4652a">150t (+50%)</text>
  
  <!-- Reuse cycles -->
  <text x="80" y="330" font-size="11" fill="#555">再使用回数</text>
  <rect x="150" y="315" width="60" height="15" fill="#2a5f8a" rx="3"/>
  <text x="215" y="326" font-size="10" fill="#2a5f8a">5回</text>
  <rect x="350" y="315" width="110" height="15" fill="#d4652a" rx="3"/>
  <text x="465" y="326" font-size="10" fill="#d4652a">10回 (+100%)</text>
  
  <!-- Starlink capacity -->
  <text x="80" y="365" font-size="11" fill="#555">Starlink/回</text>
  <rect x="150" y="350" width="70" height="15" fill="#2a5f8a" rx="3"/>
  <text x="225" y="361" font-size="10" fill="#2a5f8a">30機</text>
  <rect x="350" y="350" width="110" height="15" fill="#d4652a" rx="3"/>
  <text x="465" y="361" font-size="10" fill="#d4652a">60機 (+100%)</text>
  
  <!-- Footer -->
  <text x="400" y="400" text-anchor="middle" font-size="10" fill="#999">※ スターシップV3 (Flight 13) の技術データに基づく</text>
  <text x="400" y="420" text-anchor="middle" font-size="9" fill="#bbb">出典: SpaceX公式資料, Space.com</text>
  
  <!-- Labels -->
  <text x="400" y="460" text-anchor="middle" font-size="13" fill="#999">【加藤宇宙開発ニュース #94】</text>
  <text x="400" y="480" text-anchor="middle" font-size="11" fill="#bbb">Starship Flight 13 — V3の再起動</text>
</svg>
