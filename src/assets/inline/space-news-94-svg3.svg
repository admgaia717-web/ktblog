<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#e8e0d6"/>
    </linearGradient>
    <linearGradient id="costeur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4652a"/>
      <stop offset="100%" stop-color="#b8551a"/>
    </linearGradient>
    <linearGradient id="costus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8fc4"/>
      <stop offset="100%" stop-color="#2a5f8a"/>
    </linearGradient>
    <linearGradient id="costcn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc4444"/>
      <stop offset="100%" stop-color="#aa2222"/>
    </linearGradient>
    <linearGradient id="costjp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66aa66"/>
      <stop offset="100%" stop-color="#448844"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="10"/>
  <text x="400" y="35" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#333">打上げコスト比較 — スターシップの破壊的価格</text>
  
  <!-- Cost comparison chart (log scale bars) -->
  <text x="100" y="75" font-size="11" fill="#555" font-weight="bold">Starship V3</text>
  <rect x="200" y="60" width="60" height="20" fill="url(#costeur)" rx="3"/>
  <text x="270" y="75" font-size="11" fill="#d4652a" font-weight="bold">200万$ 以下</text>
  
  <text x="100" y="110" font-size="11" fill="#555" font-weight="bold">Falcon 9</text>
  <rect x="200" y="95" width="100" height="20" fill="url(#costus)" rx="3"/>
  <text x="310" y="110" font-size="11" fill="#2a5f8a">1,500万$</text>
  
  <text x="100" y="145" font-size="11" fill="#555" font-weight="bold">H3 (日本)</text>
  <rect x="200" y="130" width="150" height="20" fill="url(#costjp)" rx="3"/>
  <text x="360" y="145" font-size="11" fill="#448844">5,000万$</text>
  
  <text x="100" y="180" font-size="11" fill="#555" font-weight="bold">長征5号 (中国)</text>
  <rect x="200" y="165" width="100" height="20" fill="url(#costcn)" rx="3"/>
  <text x="310" y="180" font-size="11" fill="#cc4444">10,000万$</text>
  
  <text x="100" y="215" font-size="11" fill="#555" font-weight="bold">アリアン6 (欧州)</text>
  <rect x="200" y="200" width="170" height="20" fill="url(#costeur)" rx="3"/>
  <text x="380" y="215" font-size="11" fill="#d4652a">12,000万$</text>
  
  <text x="100" y="250" font-size="11" fill="#555" font-weight="bold">SLS (NASA)</text>
  <rect x="200" y="235" width="300" height="20" fill="url(#costus)" rx="3"/>
  <text x="510" y="250" font-size="11" fill="#2a5f8a">40,000万$</text>
  
  <!-- Scale legend -->
  <text x="300" y="295" font-size="9" fill="#999">0</text>
  <line x1="200" y1="300" x2="500" y2="300" stroke="#ddd" stroke-width="1"/>
  <text x="500" y="295" font-size="9" fill="#999">100,000万$</text>
  
  <!-- Reusability impact section -->
  <text x="400" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#333">再使用がもたらすコスト革命</text>
  
  <!-- Cost per kg comparison -->
  <text x="150" y="375" font-size="12" fill="#555">kgあたり打上げコスト</text>
  
  <rect x="50" y="385" width="160" height="25" fill="url(#costeur)" rx="3"/>
  <text x="130" y="402" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Starship: 1,300$</text>
  
  <rect x="230" y="385" width="120" height="25" fill="url(#costus)" rx="3"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#fff">Falcon9: 2,700$</text>
  
  <rect x="370" y="385" width="120" height="25" fill="url(#costjp)" rx="3"/>
  <text x="430" y="402" text-anchor="middle" font-size="11" fill="#fff">H3: 6,900$</text>
  
  <rect x="510" y="385" width="120" height="25" fill="url(#costcn)" rx="3"/>
  <text x="570" y="402" text-anchor="middle" font-size="11" fill="#fff">長征5: 10,000$</text>
  
  <rect x="650" y="385" width="120" height="25" fill="url(#costus)" rx="3"/>
  <text x="710" y="402" text-anchor="middle" font-size="11" fill="#fff">SLS: 29,000$</text>
  
  <!-- Callout -->
  <rect x="80" y="435" width="640" height="45" fill="#fff5e8" rx="8" stroke="#d4652a" stroke-width="1.5"/>
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#d4652a" font-weight="bold">スターシップは1kgあたり約1,300ドル。従来比で約20分の1のコスト削減を実現。</text>
  <text x="400" y="472" text-anchor="middle" font-size="10" fill="#999">H3は同じkgを運ぶのにスターシップの5倍以上かかる</text>
</svg>
